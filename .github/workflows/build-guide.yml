name: Build TV guide

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-guide
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build guide
        shell: pwsh
        run: ./build-guide.ps1

      - name: Publish guide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view guide >/dev/null 2>&1 || gh release create guide --title "TV guide" --notes "Updated daily by GitHub Actions."
          gh release upload guide tv-guide.xml.gz --clobber

      # GitHub pauses scheduled workflows after 60 idle days, so record each run.
      - name: Keep schedule alive
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.txt
          git commit -m "Record guide run" || exit 0
          git push
